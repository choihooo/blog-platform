fields:
  item_name:
    type: string
    description: Name of the research item.
  references:
    type: array
    description: Five to eight strong references, each with title, creator_or_publisher, direct_url, format, access_status, why_relevant, reusable_patterns, and cautions.
  strongest_reference:
    type: object
    description: The single most useful reference with title, direct_url, and selection_reason.
  visual_patterns:
    type: array
    description: Concrete visual patterns including grid, typography, color, hierarchy, image treatment, tables, and navigation.
  content_patterns:
    type: array
    description: Concrete storytelling patterns including project selection, problem framing, process compression, evidence, metrics, and outcomes.
  a4_adaptation:
    type: array
    description: Specific recommendations for adapting the references into an A4 PDF using Hozui components and tokens.
  avoid_patterns:
    type: array
    description: Patterns that should not be copied due to poor print behavior, accessibility, excessive length, or weak evidence.
  source_quality_notes:
    type: string
    description: Notes on source authority, accessibility, and any inferred conclusions.
  uncertain:
    type: array
    description: Field names containing uncertain values.
